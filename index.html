<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spine crosswords</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EFF2F2; --card:#FFFFFF; --ink:#0E1518; --ink2:#4C5B60; --ink3:#84959A;
  --line:#D5DEDF; --line2:#B9C6C8;
  --teal:#0D6F62; --teal-soft:#DBEDE8; --teal-line:#8FC4B9;
  --amber:#9A6A0B; --clay:#A3372A; --clay-soft:#F7E2DE;
  --f-disp:"IBM Plex Sans Condensed","Helvetica Neue",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root{
    --paper:#0F1618; --card:#171F21; --ink:#E7EDEC; --ink2:#9FB0B2; --ink3:#6E8084;
    --line:#2A3639; --line2:#3B4A4E;
    --teal:#4FBFA9; --teal-soft:#123430; --teal-line:#2C6F63;
    --amber:#D9A445; --clay:#E0776A; --clay-soft:#3A1F1B;
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper); color:var(--ink); font-family:var(--f-body); font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased}

.bar{display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; padding:18px 24px 12px; background:var(--card)}
.bar h1{font-family:var(--f-disp); font-weight:600; font-size:21px; letter-spacing:.01em; margin:0; text-transform:uppercase}
.tools{margin-left:auto; display:flex; gap:6px; flex-wrap:wrap}
button{font-family:var(--f-body); font-size:13px; color:var(--ink); background:transparent; border:1px solid var(--line2); border-radius:2px; padding:6px 11px; cursor:pointer}
button:hover{background:var(--teal-soft); border-color:var(--teal-line)}
button:active{transform:translateY(1px)}
button[aria-pressed="true"]{background:var(--teal); border-color:var(--teal); color:#fff}
@media (prefers-color-scheme:dark){button[aria-pressed="true"]{color:#0F1618}}
button:focus-visible{outline:2px solid var(--teal); outline-offset:2px}

.tabs{display:flex; gap:0; flex-wrap:wrap; padding:0 24px; background:var(--card); border-bottom:1px solid var(--line2)}
.tabs button{
  border:0; border-bottom:2px solid transparent; border-radius:0; padding:9px 14px 8px;
  font-family:var(--f-disp); font-weight:500; font-size:13.5px; letter-spacing:.03em;
  text-transform:uppercase; color:var(--ink3); background:transparent;
}
.tabs button:hover{background:transparent; color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--ink); border-bottom-color:var(--teal); background:transparent}
.tabs .cnt{font-family:var(--f-mono); font-size:10.5px; color:var(--ink3); margin-left:6px}

main{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:28px; padding:24px; align-items:start; max-width:1180px; margin:0 auto}
@media (max-width:900px){main{grid-template-columns:minmax(0,1fr); gap:20px; padding:16px}}

.board{position:sticky; top:16px}
@media (max-width:900px){.board{position:static}}
.now{font-family:var(--f-mono); font-size:12px; color:var(--ink2); letter-spacing:.02em; min-height:34px; padding:7px 10px; margin:0 0 10px; background:var(--card); border:1px solid var(--line); border-left:3px solid var(--teal)}
.now b{font-family:var(--f-body); font-weight:500; color:var(--ink)}
.frame{display:flex; gap:10px; align-items:stretch}
.rail{width:14px; flex:0 0 14px; display:grid; gap:2px; padding:2px; background:var(--card); border:1px solid var(--line)}
.rail i{display:block; background:var(--line); border-radius:1px}
.rail i.on{background:var(--teal)}
.grid{flex:1; display:grid; grid-template-columns:repeat(var(--cols),1fr); aspect-ratio:var(--cols)/var(--rows); background:transparent; --cols:15; --rows:15; --fs:20px; --nfs:8px}
.cell{position:relative; background:var(--card); border-right:1px solid var(--line2); border-bottom:1px solid var(--line2)}
.cell.bt{border-top:1px solid var(--line2)}
.cell.bl{border-left:1px solid var(--line2)}
.cell.blk{background:transparent; border:0}
.cell .n{position:absolute; top:1px; left:2px; font-family:var(--f-mono); font-size:var(--nfs); color:var(--ink3); line-height:1; pointer-events:none; z-index:2}
.cell input{width:100%; height:100%; border:0; background:transparent; text-align:center; font-family:var(--f-disp); font-weight:600; font-size:var(--fs); color:var(--ink); text-transform:uppercase; padding:0; caret-color:transparent; cursor:pointer}
.cell input:focus{outline:0}
.cell.hl{background:var(--teal-soft)}
.cell.sel{background:var(--teal)}
.cell.sel input{color:#fff}
@media (prefers-color-scheme:dark){.cell.sel input{color:#0F1618}}
.cell.sel .n{color:rgba(255,255,255,.75)}
.cell.given input{color:var(--amber)}
.cell.wrong{background:var(--clay-soft)}
.cell.wrong input{color:var(--clay)}
.status{font-family:var(--f-mono); font-size:11.5px; color:var(--ink3); margin:10px 0 0; letter-spacing:.03em}

.clues{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:24px}
@media (max-width:1180px){.clues{grid-template-columns:minmax(0,1fr)}}
.clues h2{font-family:var(--f-disp); font-weight:600; text-transform:uppercase; letter-spacing:.06em; font-size:13px; color:var(--ink2); margin:0 0 8px; padding-bottom:6px; border-bottom:1px solid var(--line2)}
ol.cl{list-style:none; margin:0; padding:0}
ol.cl li{display:grid; grid-template-columns:34px minmax(0,1fr); gap:8px; padding:7px 8px 7px 4px; cursor:pointer; border-left:3px solid transparent; font-size:13.5px; line-height:1.5}
ol.cl li:hover{background:var(--card)}
ol.cl li.active{background:var(--card); border-left-color:var(--teal)}
ol.cl li.done .q{color:var(--ink3)}
ol.cl .k{font-family:var(--f-mono); font-size:12px; color:var(--ink2); padding-top:1px}
ol.cl .a{display:none; font-family:var(--f-disp); font-weight:600; letter-spacing:.05em; color:var(--teal); text-transform:uppercase; font-size:12.5px; margin-top:2px}
body.answers ol.cl .a{display:block}
</style>
</head>
<body>

<header class="bar">
  <h1>Spine crosswords</h1>
  <div class="tools">
    <button id="btnAns" aria-pressed="false">Show answers</button>
    <button id="btnCheck">Check</button>
    <button id="btnLetter">Reveal letter</button>
    <button id="btnWord">Reveal word</button>
    <button id="btnClear">Clear</button>
  </div>
</header>
<nav class="tabs" id="tabs" role="tablist"></nav>

<main>
  <section class="board">
    <p class="now" id="now">Pick a square or a clue to start.</p>
    <div class="frame">
      <div class="rail" id="rail" aria-hidden="true"></div>
      <div class="grid" id="grid"></div>
    </div>
    <p class="status" id="status"></p>
  </section>
  <section class="clues">
    <div><h2>Across</h2><ol class="cl" id="acr"></ol></div>
    <div><h2>Down</h2><ol class="cl" id="dwn"></ol></div>
  </section>
</main>

e patient still walks.","LESS":"Trial finding that adding steroid to local anaesthetic gave little extra benefit in a narrowed lumbar canal.","FACET":"The paired joints at the back of each level, supplied by the medial branch — the target for ablation.","SLIP":"Trial pitting decompression alone against decompression plus fusion in a grade I degenerative listhesis.","MODIC":"Endplate changes on MRI. Type 1 is swelling and the painful one, type 2 is fat, type 3 is sclerosis.","MEYERDING":"Forward translation graded in quarters of the endplate below, with a fifth grade for the vertebra that leaves entirely.","HARMS":"Goel–… fixation: C1 lateral mass and C2 pedicle screws on rods. Kinder to the vertebral artery than 4 Across.","STASCIS":"The study behind operating on a cervical cord injury within twenty-four hours.","PARS":"The isthmus of bone between the upper and lower articular processes. Its stress fracture is the collar on the Scottie dog.","DENIS":"The three-column model of the spine. The middle column is the one that decides stability.","DISH":"Flowing bone bridging four or more levels at the front of the spine; a small fall then breaks all three columns."},"n":24},{"id":"cervical","name":"Cervical spine","rows":["CLOWARD.......","....T.E.LAMINA","SPURLING..Y...","U.N.A.S.THECAL","B.C.S.....L.C.","AXIS.ODONTOID.","X.N.......P.F.","I.A.B.O.H.A...","ARTHROPLASTY..","L.E.O.L.N.H...","...GOEL.G.Y...","A.A.K...M..S..","C.LUSCHKA..L..","C.A.....NURICK","FERGUSON...C.."],"clues":{"ACCF":"When the compression sits behind the body rather than at the level of the disc, this is what takes it out.","ACDF":"The commonest cervical operation: clear the disc, put in a graft or cage, plate the front.","ALAR":"Paired ligaments running from the peg to the occipital condyles; they check rotation and tear in occipitocervical dissociation.","ARTHROPLASTY":"Disc replacement rather than fusion, meant to preserve motion and spare the level next door.","ATLAS":"C1 — a ring with no body, carrying the skull.","AXIS":"C2 — the vertebra the ring above it turns on.","BROOKS":"…–Jenkins C1–C2 fusion using bilateral wedge grafts and wires passed beneath the arch; better rotational control than Gallie.","CLOWARD":"Described the anterior cervical dowel fusion in 1958, drilling a circular trough and impacting a matched graft.","DENS":"The peg of C2, held against the anterior arch of C1 by the transverse ligament.","FERGUSON":"Allen–… classification, grouping lower cervical injuries by the mechanism the injuring vector implies.","GOEL":"…–Harms C1 lateral mass and C2 pars screws, the modern alternative to transarticular fixation.","HANGMAN":"Traumatic spondylolisthesis of C2 through both pars, graded by Levine and Edwards.","LAMINA":"The roof over the canal. Remove it and you decompress; hinge and replace it and you have a laminoplasty.","LUSCHKA":"Uncovertebral joints of … ; osteophytes here narrow the foramen and pinch the exiting root.","MYELOPATHY":"Cord dysfunction rather than root: clumsy hands, a broad gait, brisk reflexes below the level.","NURICK":"Six-grade scale of gait and disability in cervical spondylosis, running 0 to 5.","ODONTOID":"The C2 process whose type II fracture is the one that so often fails to unite.","OPLL":"Ossification behind the body, commoner in East Asia; where it invades the dura, the anterior route becomes a CSF problem.","SLIC":"Points-based system scoring morphology, discoligamentous integrity and neurology; 5 or more favours surgery.","SPURLING":"Extension, rotation and axial load reproducing arm pain. Specific, but far from sensitive.","SUBAXIAL":"Everything from C3 downwards, where the anatomy stops being exceptional.","THECAL":"The … sac, the dural tube the cord and roots travel in.","UNCINATE":"The upturned lip of the cervical body; its lateral edge is where a corpectomy trough must stop."},"n":23},{"id":"lumbar","name":"Lumbar degenerative","rows":["..N....TROPISM.","EQUINA......T..","..C.....B...E.L",".CLAUDICATION.A","..E.....A...O.M","..U.....S.C.S.I","..SEQUESTRATION",".S....X.R.G.S.E",".C.C..T.U.E...C",".I.E..R.P..W..T",".ANNULUS...I..O",".T.T..S....L..M","MICRODISCECTOMY",".C.A..O....S...",".A.L..N.RECESS."],"clues":{"ANNULUS":"… fibrosus — concentric lamellae with alternating fibre angle, innervated only in its outer third.","BAASTRUP":"Kissing spinous processes rubbing on each other; a cause of midline pain relieved by flexion.","CAGE":"Interbody spacer. Its footprint on the apophyseal ring decides whether it stays put.","CENTRAL":"The variety of canal narrowing that sits in the midline, as opposed to the lateral or foraminal kinds.","CLAUDICATION":"Neurogenic, not vascular: worse walking downhill, better leaning forward, pulses intact.","EQUINA":"Cauda … — the lumbosacral roots below the conus. Compress them and it becomes an emergency.","EXTRUSION":"Herniation whose base is narrower than its dome — through the outer fibres but still attached to its parent.","LAMINECTOMY":"Take the roof off. Still the reference operation against which everything else is measured.","MICRODISCECTOMY":"Small window, microscope, take the fragment. The workhorse for a radiculopathy that won't settle.","NUCLEUS":"… pulposus — the proteoglycan-rich core that dehydrates first and starts the whole cascade.","RECESS":"Lateral … — the corner between the facet and the body where the traversing root gets caught.","SCIATICA":"Leg pain along the nerve's distribution; the symptom, never the diagnosis.","SEQUESTRATION":"The fragment has separated and is free in the canal, no longer continuous with the disc.","STENOSIS":"Narrowing. Congenital short pedicles make the acquired kind arrive far earlier.","TROPISM":"Asymmetry between the two facet joints at a level, proposed as a starter for degeneration.","WILTSE":"Muscle-splitting approach between multifidus and longissimus, straight onto the transverse process."},"n":16},{"id":"deformity","name":"Deformity & alignment","rows":["SACRAL.PLUMB..S",".....E.....R..A","...CONGENITAL.N",".....K.....C..D",".PONTE...ZIELKE","....E...L.....R","..O.T.D.O..I..S","K.SCHEUERMANN..","Y.T.E.B.D..C..F","P.E.R.O.O..I..U","H.O...U.S.ADAMS","O.T.K.S.I..E..I","SCOLIOSIS..N..O","I.M.N.E....C..N","S.Y.G.T.DWYER.."],"clues":{"ADAMS":"Forward bend test. The rib hump appears because the curve carries rotation, not just tilt.","BRACE":"Non-operative treatment for a growing curve; hours worn per day predicts whether it works.","CONGENITAL":"Curvature present from birth, caused by a vertebra that failed to form or to segment properly.","DUBOUSSET":"Cotrel–… instrumentation, which added rod derotation and made correction three-dimensional.","DWYER":"Anterior instrumentation running a cable through vertebral body screws — an early flexible system.","FUSION":"The point of most of it: get the levels to knit so the correction holds.","INCIDENCE":"Pelvic … , the one pelvic parameter that never changes. The curve at 10 Down should sit within 10 degrees of it.","KING":"Five-type classification of thoracic curves, superseded by 2 Down.","KYPHOSIS":"Backward curve — normal in the thorax, pathological when the segment holds more than it should.","LENKE":"Six curve types, a lumbar modifier and a sagittal modifier; it defines which curves are structural.","LORDOSIS":"Forward curve of the lumbar spine, two-thirds of it below L4.","OSTEOTOMY":"Cutting bone to change alignment. Graded 1 to 6 by how many columns you take.","PLUMB":"The line dropped from C7; where it lands relative to the sacrum is sagittal balance.","PONTE":"Posterior column resection of facets and flavum, five to ten degrees a level through a mobile disc.","SACRAL":"… slope — the angle of the S1 endplate to horizontal. Add pelvic tilt and you get the fixed parameter at 13 Down.","SANDERS":"Hand radiograph staging of skeletal maturity, finer than Risser for judging the growth left.","SCHEUERMANN":"Rigid thoracic deformity with wedging of three consecutive bodies and irregular endplates.","SCOLIOS cid areflexia after injury, temporary and misleading if you grade too early.","SYRINGOMYELIA":"Late cavitation in the cord; new ascending loss or pain years after injury should prompt the scan.","TONGS":"Gardner-Wells, for applying traction and reducing a dislocation before anything else is done.","WEDGE":"Compression fracture losing anterior height while the middle column stays intact."},"n":16},{"id":"tumour","name":"Tumour & infection","rows":[".PSOAS.GIBBUS..","..A.......R.P..","TERATOMA..A.O.B","O.C.O...B.C.N.I","M.O.K.M.I.H.D.L","I.M.U.E.O.Y.Y.S","T.A.H.N.P.U.L.K","A..RADIOSURGERY","..A.S.N.Y.Y.C..","..B.H.G.....T..","DISCITIS.P.POTT","..C...O..L..M..","EPENDYMOMA..Y..","..S...A..N.....","..S.....CALVE.."],"clues":{"ABSCESS":"Epidural collection. Fever, back pain and neurology rarely all turn up together.","BILSKY":"Six-tier grading of epidural cord compression on axial T2; grade 2 or 3 counts as high grade.","BIOPSY":"Do it before you resect, and place the tract where the definitive incision will take it out.","BRACHYURY":"Nuclear stain confirming notochordal origin, separating chordoma from its cartilaginous mimic.","CALVE":"… disease — the collapsed flat vertebra of eosinophilic granuloma.","DISCITIS":"Infection beginning at the endplate and spreading into the intervertebral space; ESR and CRP track it better than the white count.","EPENDYMOMA":"Commonest intramedullary tumour in adults. It has a plane, so gross total resection is realistic.","GIBBUS":"The sharp angular kyphos left behind by tuberculous collapse.","MENINGIOMA":"Intradural extramedullary tumour: usually thoracic, usually female, usually curable.","PLANA":"Vertebra … — the completely flattened body, the end state of 17 Across.","POTT":"… disease — spinal tuberculosis, sparing the disc early and tracking beneath the ligament.","PSOAS":"Muscle the tuberculous collection tracks along, presenting as a groin mass far from the spine.","RADIOSURGERY":"Ablative dose in one or a few fractions; separation surgery exists to make room for it.","SARCOMA":"Malignant tumour of mesenchymal origin — osteo-, chondro- and Ewing all appear in the spine.","SPONDYLECTOMY":"En bloc removal of an entire vertebra, the operation the staging at 6 Down selects for.","TERATOMA":"Germ cell tumour with tissue from all three layers; rare intraspinally, often with dysraphism.","TOKUHASHI":"Revised six-parameter score predicting survival in metastatic spine disease.","TOMITA":"Seven-type classification of vertebral tumours by compartment, plus a prognostic score."},"n":18},{"id":"instrument","name":"Instrumentation","rows":["...TITANIUM..H.","..........O..O.","..MATRIX.ANCHOR","..O.......O..K.","..M..CORTICAL..",".PEEK.....O...T","A.N...A.SCREW.R","L.TORQUE..T...A","L.....T...I...J","OSTEOCONDUCTIVE","G.....G...A...C","R..M..R.PULLOUT","A.MEDIAL......O","F..S..F.......R","T..H.STEFFEE..Y"],"clues":{"ALLOGRAFT":"Banked donor bone. A fine scaffold and structurally useful, but it arrives with no living cells.","ANCHOR":"Generic term for whatever grips bone at each level of a construct.","AUTOGRAFT":"The patient's own bone. The only graft that is osteogenic as well as a scaffold and a stimulus.","CORTICAL":"The dense outer shell of bone, and the name of the 8 Down that starts near the midline and angles up and out for purchase in osteoporosis.","HOOK":"Laminar or pedicular claw from the era before pedicle fixation, still useful at the top of a long construct.","MATRIX":"Demineralised bone … — processed banked bone retaining inductive proteins but no structural strength.","MEDIAL":"The direction of pedicle breach that threatens the cord, as opposed to the one that threatens the vessels.","MESH":"Cylindrical cage packed with graft, used to rebuild a body after corpectomy.","MOMENT":"Force times distance. The reason a long lever above a fused segment eventually fails.","MONOCORTICAL":"Purchase that stops short of the far cortex — the safer anterior cervical option, at some cost in holding strength.","OSTEOCONDUCTIVE":"Acts as a scaffold for bone to grow along, without stimulating anything itself.","PEEK":"Polymer cage material with a modulus close to bone, radiolucent so union can actually be judged.","PULLOUT":"The failure mode 12 Across is meant to predict; it tracks bone density more than technique.","SCREW":"The threaded implant that changed everything, once its placement in the pedicle became routine.","STEFFEE":"Surgeon whose variable-placement plate system popularised pedicle fixation in the 1980s.","TITANIUM":"Alloy of choice: osseointegrates, and scatters far less on postoperative CT than stainless steel.","TORQUE":"Measured on insertion as a proxy for how well the implant is gripping.","TRAJECTORY":"The path chosen through the pedicle — straightforward, anatomic, or the route named at 6 Across."},"n":18},{"id":"paeds","name":"Paediatric & dysraphism","rows":["...ARNOLD.L....","C......I..A....","O.....SPLITCORD","NAEVUS.O..E.C.E","U......M..X.C.R","SHUNT..A....U.M","....E.......L.A","....T...D.FETAL","...CHIARI...A.S","P...E...MOMS..I","ALLERGY.P...F.N","N...E...L...I.U","G.HYDROCEPHALUS","............U..","...DYSRAPHISM.."],"clues":{"ALLERGY":"Sensitisation to the material at 3 Down — common after repeated childhood surgery, and why theatre goes free of it from the start.","ARNOLD":"The first half of the eponym pair for hindbrain herniation, type II going with myelomeningocele.","CHIARI":"Tonsillar descent below the foramen magnum; type I often presents with a cough headache.","CONUS":"The tapered end of the cord. Sitting below L2 on MRI is the imaging definition of tethering.","DERMALSINUS":"Midline tract from skin to dura. Never probe it; image it, because it can seed meningitis.","DIMPLE":"Sacral … — low and small is benign; high, large or off midline earns an ultrasound.","DYSRAPHISM":"Failure of the neural tube and its coverings to close; open or occult.","FETAL":"… surgery — closing the defect before birth, the intervention 15 Across tested.","FILUM":"… terminale — the fibrous strand running from the cord's tip to the coccyx; thickened beyond 2 mm it tethers.","HYDROCEPHALUS":"Follows most myelomeningocele closures and usually needs diverting.","LATEX":"The glove and catheter material behind the commonest sensitisation in these children.","LIPOMA":"Fatty mass continuous with the cord through a dural defect; the commonest occult tethering lesion.","MOMS":"Trial showing prenatal repair reduced the need for diversion and improved motor outcome, at a cost in prematurity.","NAEVUS":"Capillary stain over the lumbar midline; one of the cutaneous markers of an occult lesion.","OCCULTA":"Spina bifida … — a bony defect with skin intact, often an incidental finding of no consequence.","PANG":"Described the two types of the malformation at 5 Across and unified the older terminology.","SHUNT":"The diversion most of these children eventually need, and the thing that most often fails.","SPLITCORD":"Malformation with two hemicords, divided by a bony spur in type I or a fibrous band in type II.","TETHERED":"Cord held low and stretched; back pain, foot deformity and bladder change in a growing child."},"n":19}];

var gridEl=document.getElementById("grid"), railEl=document.getElementById("rail"),
    nowEl=document.getElementById("now"), statusEl=document.getElementById("status"),
    acrEl=document.getElementById("acr"), dwnEl=document.getElementById("dwn"),
    tabsEl=document.getElementById("tabs");

var P, ROWS, NC, NR, cells, entries, cur, curCell, pi=0, answers=false, stash=null;

function on(r,c){return r>=0&&r<NR&&c>=0&&c<NC&&ROWS[r].charAt(c)!=="."}
function idx(r,c){return r*NC+c}

function mount(k){
  pi=k; P=PUZZLES[k]; ROWS=P.rows; NR=ROWS.length; NC=ROWS[0].length;
  answers=false; document.body.classList.remove("answers"); stash=null;
  var ab=document.getElementById("btnAns");
  ab.setAttribute("aria-pressed","false"); ab.textContent="Show answers";

  gridEl.innerHTML=""; railEl.innerHTML=""; acrEl.innerHTML=""; dwnEl.innerHTML="";
  gridEl.style.setProperty("--cols",NC); gridEl.style.setProperty("--rows",NR);
  cells=new Array(NR*NC); entries=[]; cur=null; curCell=null;

  var numAt={}, n=0, r, c;
  for(r=0;r<NR;r++)for(c=0;c<NC;c++){
    if(!on(r,c))continue;
    if((!on(r,c-1)&&on(r,c+1))||(!on(r-1,c)&&on(r+1,c))){n++; numAt[r+","+c]=n;}
  }
  for(r=0;r<NR;r++)for(c=0;c<NC;c++){
    var num=numAt[r+","+c]; if(!num)continue;
    if(!on(r,c-1)&&on(r,c+1)){
      var a="",l1=[],cc=c;
      while(on(r,cc)){a+=ROWS[r].charAt(cc); l1.push(idx(r,cc)); cc++;}
      entries.push({num:num,dir:"A",cells:l1,answer:a});
    }
    if(!on(r-1,c)&&on(r+1,c)){
      var b="",l2=[],rr=r;
      while(on(rr,c)){b+=ROWS[rr].charAt(c); l2.push(idx(rr,c)); rr++;}
      entries.push({num:num,dir:"D",cells:l2,answer:b});
    }
  }
  entries.sort(function(x,y){return x.dir===y.dir?x.num-y.num:(x.dir==="A"?-1:1)});
  entries.forEach(function(e,j){e.j=j; e.clue=P.clues[e.answer]||"";});

  for(var i=0;i<NR*NC;i++){
    var rw=Math.floor(i/NC), cl=i%NC, d=document.createElement("div");
    if(!on(rw,cl)){d.className="cell blk"; gridEl.appendChild(d); continue;}
    d.className="cell"+(on(rw-1,cl)?"":" bt")+(on(rw,cl-1)?"":" bl");
    var nm=numAt[rw+","+cl];
    if(nm){var s=document.createElement("span"); s.className="n"; s.textContent=nm; d.appendChild(s);}
    var inp=document.createElement("input");
    inp.type="text"; inp.maxLength=1; inp.autocomplete="off"; inp.autocapitalize="characters";
    inp.spellcheck=false; inp.setAttribute("aria-label","Row "+(rw+1)+" column "+(cl+1));
    inp.dataset.i=i; d.appendChild(inp); gridEl.appendChild(d);
    cells[i]={el:d,input:inp,sol:ROWS[rw].charAt(cl),given:false};
  }

  railEl.style.gridTemplateRows="repeat("+entries.length+",1fr)";
  entries.forEach(function(e){
    var li=document.createElement("li");
    li.innerHTML='<span class="k">'+e.num+e.dir+'</span><span><span class="q">'+e.clue+
      '</span> ('+e.answer.length+')<span class="a">'+e.answer+'</span></span>';
    li.addEventListener("click",function(){select(e,true)});
    e.li=li; (e.dir==="A"?acrEl:dwnEl).appendChild(li);
    var bar=document.createElement("i"); bar.title=e.num+e.dir+" ("+e.answer.length+")";
    e.bar=bar; railEl.appendChild(bar);
  });

  Array.prototype.forEach.call(tabsEl.children,function(t,j){t.setAttribute("aria-selected",String(j===k))});
  load(); sizeGrid(); select(entries[0],true);
}

function entryAt(i,dir){
  var j;
  for(j=0;j<entries.length;j++) if(entries[j].dir===dir&&entries[j].cells.indexOf(i)>=0) return entries[j];
  for(j=0;j<entries.length;j++) if(entries[j].cells.indexOf(i)>=0) return entries[j];
  return null;
}
function paint(){
  cells.forEach(function(x){if(x)x.el.classList.remove("hl","sel")});
  entries.forEach(function(e){e.li.classList.remove("active")});
  if(cur){
    cur.cells.forEach(function(i){cells[i].el.classList.add("hl")});
    cur.li.classList.add("active");
    nowEl.innerHTML="<b>"+cur.num+" "+(cur.dir==="A"?"Across":"Down")+" ("+cur.answer.length+")</b> &nbsp;"+cur.clue;
  }
  if(curCell!=null&&cells[curCell])cells[curCell].el.classList.add("sel");
  refresh();
}
function select(e,firstEmpty){
  cur=e; var t=e.cells[0];
  if(firstEmpty)for(var j=0;j<e.cells.length;j++){if(!cells[e.cells[j]].input.value){t=e.cells[j];break;}}
  curCell=t; cells[t].input.focus(); paint();
  if(e.li.scrollIntoView)e.li.scrollIntoView({block:"nearest"});
}
function step(d){
  if(!cur)return;
  var p=cur.cells.indexOf(curCell)+d;
  if(p<0||p>=cur.cells.length)return;
  curCell=cur.cells[p]; cells[curCell].input.focus(); paint();
}
function nextEntry(d){ if(cur) select(entries[(cur.j+d+entries.length)%entries.length],true); }
function refresh(){
  var filled=0;
  entries.forEach(function(e){
    var full=e.cells.every(function(i){return cells[i].input.value});
    e.bar.classList.toggle("on",full); e.li.classList.toggle("done",full);
    if(full)filled++;
  });
  statusEl.textContent=filled+" of "+entries.length+" entries filled";
  save();
}

gridEl.addEventListener("click",function(ev){
  var inp=ev.target.closest("input"); if(!inp)return;
  var i=+inp.dataset.i;
  if(curCell===i&&cur){var o=entryAt(i,cur.dir==="A"?"D":"A"); if(o&&o!==cur)cur=o;}
  else cur=entryAt(i,cur?cur.dir:"A");
  curCell=i; paint();
});
gridEl.addEventListener("focusin",function(ev){
  var inp=ev.target.closest("input"); if(!inp)return;
  var i=+inp.dataset.i;
  if(curCell!==i){curCell=i; cur=entryAt(i,cur?cur.dir:"A"); paint();}
});
gridEl.addEventListener("input",function(ev){
  var inp=ev.target.closest("input"); if(!inp)return;
  var v=inp.value.slice(-1).toUpperCase();
  inp.value=/[A-Z]/.test(v)?v:"";
  var i=+inp.dataset.i;
  cells[i].el.classList.remove("wrong","given"); cells[i].given=false;
  if(inp.value)step(1); else refresh();
});
gridEl.addEventListener("keydown",function(ev){
  var inp=ev.target.closest("input"); if(!inp)return;
  var i=+inp.dataset.i, r=Math.floor(i/NC), c=i%NC, k=ev.key;
  if(k==="Backspace"){
    ev.preventDefault();
    if(inp.value){inp.value=""; cells[i].el.classList.remove("wrong","given"); cells[i].given=false; refresh();}
    else step(-1);
    return;
  }
  if(k===" "){ev.preventDefault(); var o=entryAt(i,cur&&cur.dir==="A"?"D":"A"); if(o){cur=o; paint();} return;}
  if(k==="Tab"){ev.preventDefault(); nextEntry(ev.shiftKey?-1:1); return;}
  if(k==="Enter"){ev.preventDefault(); nextEntry(1); return;}
  var map={ArrowRight:[0,1],ArrowLeft:[0,-1],ArrowUp:[-1,0],ArrowDown:[1,0]};
  if(map[k]){
    ev.preventDefault();
    var want=(k==="ArrowLeft"||k==="ArrowRight")?"A":"D";
    if(cur&&cur.dir!==want){var e2=entryAt(i,want); if(e2){cur=e2; paint(); return;}}
    var rr=r+map[k][0], cc=c+map[k][1];
    while(rr>=0&&rr<NR&&cc>=0&&cc<NC){
      if(on(rr,cc)){curCell=idx(rr,cc); cells[curCell].input.focus(); cur=entryAt(curCell,want); paint(); return;}
      rr+=map[k][0]; cc+=map[k][1];
    }
  }
});

function letters(){var s="";for(var i=0;i<cells.length;i++)s+=cells[i]?(cells[i].input.value||" "):"";return s}
function save(){ if(answers)return; try{localStorage.setItem("spine-xw-"+P.id,letters())}catch(e){} }
function load(){
  try{
    var s=localStorage.getItem("spine-xw-"+P.id);
    if(!s||s.length!==cells.length)return;
    for(var i=0;i<cells.length;i++)if(cells[i])cells[i].input.value=s.charAt(i).trim();
  }catch(e){}
}

document.getElementById("btnAns").onclick=function(){
  answers=!answers;
  document.body.classList.toggle("answers",answers);
  this.setAttribute("aria-pressed",String(answers));
  this.textContent=answers?"Hide answers":"Show answers";
  if(answers){
    stash=letters();
    cells.forEach(function(x){if(x){x.input.value=x.sol; x.input.readOnly=true; x.el.classList.remove("wrong","given");}});
  }else{
    cells.forEach(function(x,i){
      if(!x)return;
      x.input.readOnly=false;
      x.input.value=stash?stash.charAt(i).trim():"";
      if(x.given)x.el.classList.add("given");
    });
  }
  refresh();
};
document.getElementById("btnCheck").onclick=function(){
  if(answers)return;
  var bad=0;
  cells.forEach(function(x){
    if(!x)return;
    x.el.classList.remove("wrong");
    if(x.input.value&&x.input.value!==x.sol){x.el.classList.add("wrong"); bad++;}
  });
  statusEl.textContent=bad?bad+" letter"+(bad>1?"s":"")+" wrong":"No wrong letters so far";
};
document.getElementById("btnLetter").onclick=function(){
  if(answers||curCell==null)return;
  var x=cells[curCell];
  x.input.value=x.sol; x.given=true; x.el.classList.add("given"); x.el.classList.remove("wrong");
  step(1); refresh();
};
document.getElementById("btnWord").onclick=function(){
  if(answers||!cur)return;
  cur.cells.forEach(function(i,p){
    var x=cells[i]; x.input.value=cur.answer.charAt(p); x.given=true;
    x.el.classList.add("given"); x.el.classList.remove("wrong");
  });
  refresh();
};
document.getElementById("btnClear").onclick=function(){
  if(answers)return;
  if(!confirm("Clear every letter in this puzzle?"))return;
  cells.forEach(function(x){if(x){x.input.value=""; x.given=false; x.el.classList.remove("wrong","given");}});
  refresh();
};

PUZZLES.forEach(function(p,k){
  var b=document.createElement("button");
  b.type="button"; b.setAttribute("role","tab"); b.setAttribute("aria-selected","false");
  b.innerHTML=p.name+'<span class="cnt">'+p.n+'</span>';
  b.onclick=function(){mount(k)};
  tabsEl.appendChild(b);
});

function sizeGrid(){
  var w=gridEl.clientWidth||600, cw=w/NC;
  gridEl.style.setProperty("--fs",(cw*0.54)+"px");
  gridEl.style.setProperty("--nfs",Math.max(6,cw*0.27)+"px");
}
window.addEventListener("resize",sizeGrid);
mount(0);
})();
</script>
</body>
</html>
